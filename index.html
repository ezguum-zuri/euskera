<style>
:root{--bg:#f5f2ea;--card:#fff;--ink:#1d2420;--mut:#6c7670;--line:#e6e1d6;--acc:#0f7a4a;--acc2:#d6342c;--soft:#e5f3ec;--bad:#fbe7e5;--r:18px}
@media(prefers-color-scheme:dark){:root{--bg:#111613;--card:#1b221e;--ink:#eef3f0;--mut:#93a29a;--line:#2b3430;--acc:#35c27f;--acc2:#ff6a5f;--soft:#163226;--bad:#3a1d1b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:26px;margin:8px 0 2px}h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--acc);color:#fff;cursor:pointer;margin-top:10px;text-align:center}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.red{background:var(--acc2)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.stats{display:flex;gap:8px;margin-top:6px}.stat{flex:1;background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
.lesson{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.lesson:first-child{border-top:0}
.num{min-width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--acc)}
.lesson.lock{opacity:.4;cursor:default}.lesson .t{flex:1}.lesson small{display:block;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{font-size:14px;color:var(--mut);margin-bottom:6px}
.prompt{font-size:28px;font-weight:800;margin:4px 0 4px;word-break:break-word}
.hint{color:var(--mut);font-size:14px;min-height:20px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--acc);background:var(--soft)}.opt.ko{border-color:var(--acc2);background:var(--bad)}
input[type=text],textarea{width:100%;font:inherit;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:140px;font-size:15px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:14px;border:1.5px dashed var(--line);margin:10px 0}
.tile{padding:9px 13px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font:inherit;color:var(--ink);cursor:pointer}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
.fb.ok{background:var(--soft)}.fb.ko{background:var(--bad)}
.voc{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.voc:first-of-type{border-top:0}.voc .eu{font-weight:700}.voc .p{color:var(--mut);font-size:13px}
.hidden{display:none!important}
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--acc);font-weight:700}
.speak{border:0;background:none;font-size:20px;cursor:pointer;padding:0 4px}
</style>
</head>

  else LESSONS[n]={n,week:wi+1,title:"Repaso de la semana",topic:w.t,review:true,words:[],phrases:[]}}});
const TOTAL=LESSONS.length-1;

// ===== Estado (guardado en este móvil) =====
const store={get(k,d){try{const v=localStorage.getItem("eus_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("eus_"+k,JSON.stringify(v))}catch(e){}}};
let S=store.get("stats",{}); // k -> {ok,ko,last}
let offset=store.get("offset",0);
let mine=store.get("mine","");
let streak=store.get("streak",{d:"",n:0});
let best=store.get("totalq",0);

function workdaysSinceStart(){const t=new Date();t.setHours(0,0,0,0);let c=0;const d=new Date(START);
  while(d<=t){const w=d.getDay();if(w>0&&w<6)c++;d.setDate(d.getDate()+1)}return c}
function curLesson(){let n=workdaysSinceStart()+offset;return Math.max(1,n)}
function unlocked(n){return n<=curLesson()}
function lessonOf(n){return LESSONS[((n-1)%TOTAL)+1]}
function myItems(){return mine.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.split(/\s*[=|:–—]\s*|\s+-\s+/);return m.length>=2?{eu:m[0].trim(),es:m.slice(1).join(" ").trim(),k:"m:"+m[0].trim(),n:0,mine:1}:null}).filter(Boolean)}
function poolUpTo(n){const p=[];for(let i=1;i<=Math.min(n,TOTAL);i++)p.push(...LESSONS[i].words,...LESSONS[i].phrases);return p.concat(myItems())}
function allWords(){const p=[];for(let i=1;i<=TOTAL;i++)p.push(...LESSONS[i].words);return p}

// Pista de pronunciación automática para hispanohablantes
function pron(s){let x=s.toLowerCase();
  const r=[[/tx/g,"CH"],[/tz/g,"TS"],[/ts/g,"TS"],[/x/g,"SH"],[/ll/g,"LL"],[/z/g,"s"],[/h/g,""],[/j/g,"y"]];
  let out=x;r.forEach(([a,b])=>out=out.replace(a,b));return out.toLowerCase()}
function hasTricky(s){return /tx|tz|ts|x|z|h|j/i.test(s)}
function tips(s){const t=[];if(/tx/i.test(s))t.push("tx = ch");if(/tz/i.test(s))t.push("tz = ts fuerte");if(/ts/i.test(s))t.push("ts = ts suave");if(/x/i.test(s.replace(/tx/gi,"")))t.push("x = sh");if(/z/i.test(s.replace(/tz/gi,"")))t.push("z = s suave");if(/h/i.test(s))t.push("h muda");if(/j/i.test(s))t.push("j ≈ y");return t.join(" · ")}

// Voz (si el iPhone tiene voz en euskera)
let euVoice=null;function loadVoice(){try{const v=speechSynthesis.getVoices();euVoice=v.find(x=>/^eu/i.test(x.lang))||null}catch(e){}}
try{loadVoice();speechSynthesis.onvoiceschanged=loadVoice}catch(e){}
function say(t){try{if(!euVoice)return;const u=new SpeechSynthesisUtterance(t);u.voice=euVoice;u.lang=euVoice.lang;u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function spk(t){return euVoice?`<button class="speak" onclick="say(${JSON.stringify(t).replace(/"/g,'&quot;')})">🔊</button>`:""}

const $=s=>document.querySelector(s);const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:()]/g,"").replace(/\s+/g," ").trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}

// ===== Pantalla de inicio =====
function home(){
  const c=curLesson(),L=lessonOf(c);
  const pool=poolUpTo(c);const learned=pool.filter(i=>(S[i.k]||{}).ok>0).length;
  const hard=pool.filter(i=>{const s=S[i.k];return s&&s.ko>s.ok}).length;
  const st=streak.d===today()||isYesterday(streak.d)?streak.n:0;
  let list="";for(let n=1;n<=TOTAL;n++){const l=LESSONS[n],u=unlocked(n);
    if(l.n%5===1)list+=`<div class="q" style="margin-top:12px">Semana ${l.week} · ${esc(l.topic)}</div>`;
    list+=`<div class="lesson ${u?"":"lock"}" ${u?`onclick="openLesson(${n})"`:""}><div class="num">${n}</div><div class="t">${esc(l.title)}<small>${l.review?"Repaso de lo visto en la semana":l.words.length+" palabras · "+l.phrases.length+" frases"}</small></div>${n===c?'<span class="chip">HOY</span>':u?"":"🔒"}</div>`}
  app.innerHTML=`
  <div class="top"><div><h1>Euskera</h1><p class="sub">Lección ${c} · Semana ${L.week} · ${esc(L.review?"Repaso":L.title)}</p></div><button class="icon" onclick="settings()">⚙️</button></div>
  <div class="card"><h2>Repaso de hoy</h2>
   <p class="sub" style="margin:0">10 preguntas de todo lo que llevas, con más peso en lo de hoy y en lo que fallas.</p>
   <button class="btn" onclick="startQuiz('mix')">▶︎ Empezar (≈3 min)</button>
   <div class="row"><button class="btn ghost" onclick="startQuiz('today')">Solo lo de hoy</button><button class="btn ghost" ${hard?"":"disabled"} onclick="startQuiz('hard')">Difíciles (${hard})</button></div>
   <div class="stats"><div class="stat"><b>${learned}/${pool.length}</b><span>acertadas</span></div><div class="stat"><b>${st}🔥</b><span>días seguidos</span></div><div class="stat"><b>${best}</b><span>respuestas</span></div></div>
  </div>
  <div class="card"><h2>Lecciones</h2>${list}</div>`;
}
function isYesterday(d){const y=new Date();y.setDate(y.getDate()-1);return d===(y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate())}

// ===== Ver una lección =====
function openLesson(n){const l=LESSONS[n];
  let items=l.review?poolWeek(l.week):l.words.concat(l.phrases);
  app.innerHTML=`<div class="top"><button class="icon" onclick="home()">←</button><div style="flex:1"><h1 style="font-size:22px">Lección ${n}</h1><p class="sub" style="margin:0">${esc(l.title)} · ${esc(l.topic)}</p></div></div>
  <button class="btn" onclick="startQuiz('lesson',${n})">▶︎ Preguntas de esta lección</button>
  <div class="card">${l.review?'<p class="sub">Repaso: todo lo de la semana '+l.week+'.</p>':""}${items.map(i=>`<div class="voc"><div><div class="eu">${esc(i.eu)} ${spk(i.eu)}</div>${hasTricky(i.eu)?`<div class="p">${esc(tips(i.eu))}</div>`:""}</div><div style="text-align:right">${esc(i.es)}</div></div>`).join("")}</div>`;scrollTo(0,0)}
function poolWeek(w){const p=[];for(let i=(w-1)*5+1;i<=w*5;i++)p.push(...LESSONS[i].words,...LESSONS[i].phrases);return p}

// ===== Generador de preguntas =====
let Q=[],qi=0,score=0,wrong=[],answered=false,curMode="mix",curArg=0;
function weight(i,c){const s=S[i.k]||{ok:0,ko:0};let w=1+s.ko*2-Math.min(s.ok,4)*.2;if(!s.ok&&!s.ko)w+=1;if(i.n===c||i.n===c-1)w+=2;if(i.mine)w+=1;return Math.max(.3,w)}
function pick(pool,k,c){const res=[];const p=pool.slice();while(res.length<k&&p.length){const tot=p.reduce((a,i)=>a+weight(i,c),0);let r=Math.random()*tot;let idx=0;for(;idx<p.length;idx++){r-=weight(p[idx],c);if(r<=0)break}res.push(p.splice(Math.min(idx,p.length-1),1)[0])}return res}
function startQuiz(mode,arg){curMode=mode;curArg=arg;const c=curLesson();let pool;
  if(mode==="today"){const l=lessonOf(c);pool=l.review?poolWeek(l.week):l.words.concat(l.phrases)}
  else if(mode==="lesson"){const l=LESSONS[arg];pool=l.review?poolWeek(l.week):l.words.concat(l.phrases)}
  else if(mode==="hard"){pool=poolUpTo(c).filter(i=>{const s=S[i.k];return s&&s.ko>s.ok})}
  else if(mode==="retry"){pool=wrong.slice()}
  else pool=poolUpTo(c);
  if(!pool.length){home();return}
  const items=mode==="retry"?shuffle(pool):pick(pool,Math.min(10,pool.length),c);
  Q=items.map(makeQ);qi=0;score=0;wrong=[];showQ()}
function distract(it,field,pool){const src=(it.ph?poolUpTo(TOTAL).filter(x=>x.ph):allWords().concat(myItems())).filter(x=>x[field]!==it[field]&&norm(x[field])!==norm(it[field]));
  const near=src.filter(x=>Math.abs(x.n-it.n)<=2);const base=shuffle(near.length>=6?near:src);const out=[];for(const x of base){if(!out.some(o=>norm(o)===norm(x[field])))out.push(x[field]);if(out.length===3)break}return out}
function makeQ(it){const s=S[it.k]||{ok:0};let type;
  if(it.ph){type=Math.random()<.6&&it.eu.split(" ").length>=2?"build":"es2eu"}
  else{const r=Math.random();type=s.ok>=2?(r<.5?"write":r<.75?"es2eu":"eu2es"):(r<.45?"eu2es":r<.8?"es2eu":"write")}
  if(type==="eu2es")return{it,type,prompt:it.eu,ask:"¿Qué significa?",opts:shuffle([it.es,...distract(it,"es")]),ans:it.es};
  if(type==="es2eu")return{it,type,prompt:it.es,ask:"¿Cómo se dice en euskera?",opts:shuffle([it.eu,...distract(it,"eu")]),ans:it.eu};
  if(type==="write")return{it,type,prompt:it.es,ask:"Escríbelo en euskera",ans:it.eu};
  const words=it.eu.replace(/[¿?¡!.,]/g,"").split(/\s+/);return{it,type,prompt:it.es,ask:"Ordena la frase en euskera",tiles:shuffle(words.map((w,i)=>({w,i}))),ans:words.join(" "),picked:[]}}

function showQ(){answered=false;const q=Q[qi];const pct=qi/Q.length*100;
  let body="";
  if(q.opts)body=q.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="choose(${i})">${esc(o)}</button>`).join("");
  else if(q.type==="write")body=`<input type="text" id="w" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribe aquí…" onkeydown="if(event.key==='Enter')checkWrite()"><button class="btn" id="chk" onclick="checkWrite()">Comprobar</button><button class="btn ghost" onclick="reveal()">No lo sé</button>`;
  else body=`<div class="tiles" id="ans"></div><div class="tiles" id="pool" style="border-style:solid"></div><button class="btn" id="chk" onclick="checkBuild()">Comprobar</button>`;
  app.innerHTML=`<div class="top"><button class="icon" onclick="home()">✕</button><div style="flex:1;margin-left:8px"><div class="bar"><i style="width:${pct}%"></i></div></div><span class="chip">${qi+1}/${Q.length}</span></div>
  <div class="card"><div class="q">${q.ask}${q.it.n?` · Lección ${q.it.n}`:" · Mis palabras"}</div><div class="prompt">${esc(q.prompt)} ${q.type==="eu2es"?spk(q.prompt):""}</div><div class="hint">${q.type==="eu2es"&&hasTricky(q.prompt)?esc(tips(q.prompt)):""}</div>${body}<div id="fb"></div></div>`;
  if(q.type==="build")drawTiles();if(q.type==="write")setTimeout(()=>{const w=$("#w");w&&w.focus()},50)}
function drawTiles(){const q=Q[qi];$("#ans").innerHTML=q.picked.map((t,i)=>`<button class="tile" onclick="unpick(${i})">${esc(t.w)}</button>`).join("");
  $("#pool").innerHTML=q.tiles.filter(t=>!q.picked.includes(t)).map(t=>`<button class="tile" onclick="pickT(${t.i})">${esc(t.w)}</button>`).join("")}
function pickT(i){if(answered)return;const q=Q[qi];q.picked.push(q.tiles.find(t=>t.i===i));drawTiles()}
function unpick(i){if(answered)return;Q[qi].picked.splice(i,1);drawTiles()}
function choose(i){if(answered)return;const q=Q[qi];const ok=q.opts[i]===q.ans;document.querySelectorAll(".opt").forEach((b,j)=>{if(q.opts[j]===q.ans)b.classList.add("ok");else if(j===i)b.classList.add("ko")});finish(ok)}
function accepted(q){return q.ans.split("/").map(s=>norm(s))}
function checkWrite(){if(answered)return;const v=norm($("#w").value);if(!v)return;const q=Q[qi];const ok=accepted(q).includes(v)||accepted(q).includes(norm(v.replace(/^(nik|zuk)\s/,"")));$("#w").disabled=true;finish(ok,v)}
function reveal(){if(answered)return;$("#w").disabled=true;finish(false)}
function checkBuild(){if(answered)return;const q=Q[qi];const v=q.picked.map(t=>t.w).join(" ");finish(norm(v)===norm(q.ans))}
function finish(ok,typed){answered=true;const q=Q[qi],it=q.it;const s=S[it.k]||{ok:0,ko:0};ok?s.ok++:s.ko++;s.last=Date.now();S[it.k]=s;store.set("stats",S);
  best++;store.set("totalq",best);
  if(ok)score++;else wrong.push(it);
  // racha
  if(streak.d!==today()){streak={d:today(),n:isYesterday(streak.d)?streak.n+1:1};store.set("streak",streak)}
  const almost=!ok&&typed&&lev(typed,norm(q.ans))<=1;
  document.querySelectorAll("#chk").forEach(b=>b.remove());
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"ko"}"><b>${ok?"Ondo! ✅":almost?"¡Casi! Revisa la letra ✍️":"Ez da hori ❌"}</b><br>${esc(it.eu)} ${spk(it.eu)} = ${esc(it.es)}${hasTricky(it.eu)?`<br><span style="color:var(--mut);font-size:13px">${esc(tips(it.eu))}</span>`:""}</div>
   <button class="btn" onclick="next()">${qi+1<Q.length?"Siguiente →":"Ver resultado"}</button>`;
  if(ok)say(it.eu)}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
function next(){qi++;if(qi<Q.length)showQ();else result()}
const MOT=[["Pixkanaka-pixkanaka","Poco a poco"],["Primeran!","¡Genial!"],["Aurrera!","¡Adelante!"],["Oso ondo, Esteban!","¡Muy bien, Esteban!"],["Ekinez egina","Haciendo se aprende"]];
function result(){const pct=Math.round(score/Q.length*100);const m=MOT[Math.random()*MOT.length|0];
  app.innerHTML=`<div class="card" style="text-align:center;margin-top:24px"><div style="font-size:54px">${pct===100?"🏆":pct>=70?"⭐":"📚"}</div><div class="prompt">${score}/${Q.length}</div><p class="sub" style="margin:4px 0 0"><b>${m[0]}</b> · ${m[1]}</p>
  ${wrong.length?`<button class="btn red" onclick="startQuiz('retry')">Repetir las ${wrong.length} falladas</button>`:""}
  <button class="btn" onclick="startQuiz('${curMode==="retry"?"mix":curMode}',${curArg||0})">Otra ronda</button><button class="btn ghost" onclick="home()">Inicio</button></div>
  ${wrong.length?`<div class="card"><h2>Para repasar</h2>${wrong.map(i=>`<div class="voc"><div class="eu">${esc(i.eu)}</div><div>${esc(i.es)}</div></div>`).join("")}</div>`:""}`;scrollTo(0,0)}

// ===== Ajustes =====
function settings(){const auto=workdaysSinceStart();
  app.innerHTML=`<div class="top"><button class="icon" onclick="home()">←</button><h1 style="flex:1;font-size:22px">Ajustes</h1></div>
  <div class="card"><h2>¿Por qué lección vas?</h2><p class="sub">Se calcula sola por los días laborables desde el 16 de noviembre (hoy: lección ${auto}). Ajústala si te has saltado alguna o vas adelantado.</p>
   <div class="row" style="align-items:center"><button class="btn ghost" onclick="adj(-1)">−</button><div style="text-align:center;font-size:26px;font-weight:800" id="cl">${curLesson()}</div><button class="btn ghost" onclick="adj(1)">+</button></div>
   <button class="btn ghost" onclick="offset=0;store.set('offset',0);settings()">Volver a la automática</button></div>
  <div class="card"><h2>Mis palabras</h2><p class="sub">Copia aquí palabras de tus lecciones de la mañana, una por línea: <b>euskera = castellano</b>. Entrarán en las preguntas.</p>
   <textarea id="mine" placeholder="egun on = buenos días&#10;zer moduz? = ¿qué tal?">${esc(mine)}</textarea><button class="btn" onclick="saveMine()">Guardar</button><div id="ms" class="sub"></div></div>
  <div class="card"><h2>Voz</h2><p class="sub">${euVoice?"Hay voz en euskera en este dispositivo: toca 🔊 para escuchar.":"Este dispositivo no tiene voz en euskera, así que no se muestran los botones 🔊. Usa las pistas de pronunciación."}</p></div>
  <div class="card"><button class="btn red" onclick="if(this.dataset.c){S={};store.set('stats',S);streak={d:'',n:0};store.set('streak',streak);best=0;store.set('totalq',0);home()}else{this.dataset.c=1;this.textContent='Toca otra vez para borrar el progreso'}">Borrar progreso</button></div>`;scrollTo(0,0)}
function adj(d){offset+=d;if(curLesson()<1)offset-=d;if(curLesson()>TOTAL*3)offset-=d;store.set("offset",offset);$("#cl").textContent=curLesson()}
function saveMine(){mine=$("#mine").value;store.set("mine",mine);$("#ms").textContent=myItems().length+" palabras guardadas ✔︎"}

home();
</script>
</body>
</html>
